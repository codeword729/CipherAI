name: Fix V2 Capture Button

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix capture button and version
        run: |
          python3 <<'PY'
          from pathlib import Path

          main = Path(
              "app/src/main/java/com/codeword/"
              "cipherai/MainActivity.java"
          )

          text = main.read_text(encoding="utf-8")

          anchor = '''        root.addView(start);
          '''

          capture_button = '''
                  Button captureButton = button(
                      "③ 授权并启动持续观察"
                  );

                  captureButton.setOnClickListener(
                      v -> requestScreenCapture()
                  );

                  root.addView(captureButton);
          '''

          if "③ 授权并启动持续观察" not in text:
              text = text.replace(
                  anchor,
                  anchor + capture_button,
                  1
              )

          stop_anchor = '''            intent.setAction(
                      FloatingService.ACTION_STOP
                  );
                  startService(intent);
          '''

          if stop_anchor not in text:
              stop_anchor = '''            intent.setAction(FloatingService.ACTION_STOP);
                  startService(intent);
          '''

          stop_capture = '''
                  Intent captureStop =
                      new Intent(
                          this,
                          CaptureService.class
                      );

                  captureStop.setAction(
                      CaptureService.ACTION_STOP
                  );

                  startService(captureStop);
          '''

          if "captureStop" not in text:
              text = text.replace(
                  stop_anchor,
                  stop_anchor + stop_capture,
                  1
              )

          main.write_text(text, encoding="utf-8")

          gradle = Path("app/build.gradle")
          build = gradle.read_text(encoding="utf-8")

          build = build.replace(
              "versionCode 1",
              "versionCode 2"
          )

          build = build.replace(
              'versionName "0.1.0"',
              'versionName "0.2.1"'
          )

          gradle.write_text(build, encoding="utf-8")

          manifest = Path(
              "app/src/main/AndroidManifest.xml"
          )

          value = manifest.read_text(encoding="utf-8")

          value = value.replace(
              'android:label="暗号AI"',
              'android:label="暗号AI V2"'
          )

          manifest.write_text(value, encoding="utf-8")
          PY

      - name: Save fix
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add app

          git commit \
            -m "Fix V2 capture button and version" \
            || exit 0

          git push
