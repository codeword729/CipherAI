name: Materialize Android Source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install YAML reader
        run: pip install pyyaml

      - name: Generate source from existing workflow
        run: |
          python3 <<'PY'
          import subprocess
          import yaml

          with open(
              ".github/workflows/build-apk.yml",
              "r",
              encoding="utf-8"
          ) as file:
              workflow = yaml.safe_load(file)

          steps = workflow["jobs"]["build"]["steps"]

          generator = next(
              step["run"]
              for step in steps
              if step.get("name") == "Create Android project"
          )

          subprocess.run(
              ["bash", "-e", "-c", generator],
              check=True
          )
          PY

      - name: Save generated Android source
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add \
            settings.gradle \
            build.gradle \
            app

          git commit \
            -m "Add Android application source" \
            || exit 0

          git push
