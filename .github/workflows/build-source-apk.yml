name: Build CipherAI Source APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Publish direct APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if gh release view latest >/dev/null 2>&1
          then
            gh release upload latest "$APK" --clobber
          else
            gh release create latest "$APK" \
              --title "暗号AI V2" \
              --notes "V2持续观察和帧率测试版本" \
              --latest
          fi
