name: Upgrade CipherAI V2.4 Star Clicker

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add star altar clicker
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          java_dir = Path(
              "app/src/main/java/com/codeword/cipherai"
          )

          service = r'''package com.codeword.cipherai;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.content.SharedPreferences;
          import android.graphics.Path;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.DisplayMetrics;
          import android.view.WindowManager;
          import android.view.accessibility.AccessibilityEvent;

          public class StarClickAccessibilityService
              extends AccessibilityService {

              private SharedPreferences prefs;
              private final Handler handler =
                  new Handler(Looper.getMainLooper());

              private int pointIndex = 0;

              private final float[][] points = {
                  {0.22f, 0.22f},
                  {0.42f, 0.22f},
                  {0.62f, 0.22f},
                  {0.78f, 0.22f},

                  {0.22f, 0.40f},
                  {0.42f, 0.40f},
                  {0.62f, 0.40f},
                  {0.78f, 0.40f},

                  {0.22f, 0.58f},
                  {0.42f, 0.58f},
                  {0.62f, 0.58f},
                  {0.78f, 0.58f},

                  {0.22f, 0.74f},
                  {0.42f, 0.74f},
                  {0.62f, 0.74f},
                  {0.78f, 0.74f}
              };

              private final Runnable clickLoop =
                  new Runnable() {
                      @Override
                      public void run() {
                          if (prefs == null) {
                              handler.postDelayed(
                                  this,
                                  500
                              );
                              return;
                          }

                          boolean enabled =
                              prefs.getBoolean(
                                  "star_click_enabled",
                                  false
                              );

                          if (enabled) {
                              clickNextPoint();
                          }

                          String speed =
                              prefs.getString(
                                  "star_click_speed",
                                  "slow"
                              );

                          long delay;

                          if ("fast".equals(speed)) {
                              delay = 170;
                          } else if (
                              "medium".equals(speed)
                          ) {
                              delay = 300;
                          } else {
                              delay = 500;
                          }

                          handler.postDelayed(
                              this,
                              delay
                          );
                      }
                  };

              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();

                  prefs = getSharedPreferences(
                      "cipher_settings",
                      MODE_PRIVATE
                  );

                  prefs.edit()
                      .putBoolean(
                          "star_accessibility_ready",
                          true
                      )
                      .putBoolean(
                          "star_click_enabled",
                          false
                      )
                      .apply();

                  handler.removeCallbacks(clickLoop);
                  handler.post(clickLoop);
              }

              private void clickNextPoint() {
                  DisplayMetrics metrics =
                      new DisplayMetrics();

                  WindowManager manager =
                      (WindowManager) getSystemService(
                          WINDOW_SERVICE
                      );

                  manager.getDefaultDisplay()
                      .getRealMetrics(metrics);

                  float[] point =
                      points[
                          pointIndex
                          % points.length
                      ];

                  pointIndex =
                      (pointIndex + 1)
                      % points.length;

                  float x =
                      metrics.widthPixels
                      * point[0];

                  float y =
                      metrics.heightPixels
                      * point[1];

                  Path path = new Path();
                  path.moveTo(x, y);

                  GestureDescription.StrokeDescription
                      stroke =
                      new GestureDescription
                          .StrokeDescription(
                              path,
                              0,
                              45
                          );

                  GestureDescription.Builder builder =
                      new GestureDescription.Builder();

                  builder.addStroke(stroke);

                  dispatchGesture(
                      builder.build(),
                      null,
                      null
                  );

                  prefs.edit()
                      .putFloat(
                          "star_last_x",
                          x
                      )
                      .putFloat(
                          "star_last_y",
                          y
                      )
                      .putLong(
                          "star_click_count",
                          prefs.getLong(
                              "star_click_count",
                              0
                          ) + 1
                      )
                      .apply();
              }

              @Override
              public void onAccessibilityEvent(
                  AccessibilityEvent event
              ) {
              }

              @Override
              public void onInterrupt() {
                  stopClicking();
              }

              private void stopClicking() {
                  if (prefs != null) {
                      prefs.edit()
                          .putBoolean(
                              "star_click_enabled",
                              false
                          )
                          .putBoolean(
                              "star_accessibility_ready",
                              false
                          )
                          .apply();
                  }
              }

              @Override
              public void onDestroy() {
                  handler.removeCallbacks(clickLoop);
                  stopClicking();
                  super.onDestroy();
              }
          }
          '''

          (java_dir / "StarClickAccessibilityService.java").write_text(
              service,
              encoding="utf-8"
          )

          xml_dir = Path("app/src/main/res/xml")
          xml_dir.mkdir(parents=True, exist_ok=True)

          accessibility_xml = '''<?xml version="1.0" encoding="utf-8"?>
          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/app_name"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="100"
              android:canPerformGestures="true"
              android:accessibilityFlags="flagDefault" />
          '''

          (xml_dir / "star_click_accessibility.xml").write_text(
              accessibility_xml,
              encoding="utf-8"
          )

          manifest_path = Path(
              "app/src/main/AndroidManifest.xml"
          )
          manifest = manifest_path.read_text(
              encoding="utf-8"
          )

          if (
              'android:name=".StarClickAccessibilityService"'
              not in manifest
          ):
              marker = "\n    </application>"

              service_manifest = '''
                  <service
                      android:name=".StarClickAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/star_click_accessibility" />
                  </service>
          '''

              assert marker in manifest
              manifest = manifest.replace(
                  marker,
                  service_manifest + marker,
                  1
              )

          manifest_path.write_text(
              manifest,
              encoding="utf-8"
          )

          main_path = java_dir / "MainActivity.java"
          main = main_path.read_text(encoding="utf-8")

          if "打开无障碍设置" not in main:
              marker = '''        root.addView(captureButton);

                  root.addView(text("悬浮球大小", 18, Color.WHITE));'''

              replacement = '''        root.addView(captureButton);

                  Button accessibility = button(
                      "④ 打开无障碍设置"
                  );

                  accessibility.setOnClickListener(
                      v -> {
                          Intent intent =
                              new Intent(
                                  Settings
                                      .ACTION_ACCESSIBILITY_SETTINGS
                              );

                          startActivity(intent);

                          Toast.makeText(
                              this,
                              "请在无障碍列表中开启暗号AI V2",
                              Toast.LENGTH_LONG
                          ).show();
                      }
                  );

                  root.addView(accessibility);

                  TextView starWarning = text(
                      "V2.4星星祭坛连点：先开启无障碍，"
                          + "再从悬浮球手动启动。"
                          + "离开祭坛必须暂停。",
                      14,
                      Color.rgb(255, 150, 100)
                  );

                  root.addView(starWarning);

                  root.addView(text("悬浮球大小", 18, Color.WHITE));'''

              assert marker in main
              main = main.replace(
                  marker,
                  replacement,
                  1
              )

          main_path.write_text(main, encoding="utf-8")

          floating_path = java_dir / "FloatingService.java"
          floating = floating_path.read_text(
              encoding="utf-8"
          )

          if "★ 启动祭坛连点" not in floating:
              marker = '''        Button pause = panelButton("暂停显示");
                  Button stop =
                      panelButton("■ 停止并退出悬浮服务");'''

              replacement = '''        Button pause = panelButton("暂停显示");

                  Button starSlow =
                      panelButton("祭坛速度：慢");
                  Button starMedium =
                      panelButton("祭坛速度：中");
                  Button starFast =
                      panelButton("祭坛速度：快");

                  Button starStart =
                      panelButton("★ 启动祭坛连点");
                  Button starPause =
                      panelButton("暂停祭坛连点");

                  Button stop =
                      panelButton("■ 停止并退出悬浮服务");'''

              assert marker in floating
              floating = floating.replace(
                  marker,
                  replacement,
                  1
              )

              marker = '''        panel.addView(pause);
                  panel.addView(stop);'''

              replacement = '''        panel.addView(pause);
                  panel.addView(starSlow);
                  panel.addView(starMedium);
                  panel.addView(starFast);
                  panel.addView(starStart);
                  panel.addView(starPause);
                  panel.addView(stop);'''

              assert marker in floating
              floating = floating.replace(
                  marker,
                  replacement,
                  1
              )

              marker = '''        pause.setOnClickListener(v ->
                      panel.setVisibility(View.GONE)
                  );

                  stop.setOnClickListener(v -> shutdown());'''

              replacement = '''        pause.setOnClickListener(v ->
                      panel.setVisibility(View.GONE)
                  );

                  starSlow.setOnClickListener(
                      v -> setStarSpeed("slow")
                  );

                  starMedium.setOnClickListener(
                      v -> setStarSpeed("medium")
                  );

                  starFast.setOnClickListener(
                      v -> setStarSpeed("fast")
                  );

                  starStart.setOnClickListener(
                      v -> startStarClicking()
                  );

                  starPause.setOnClickListener(
                      v -> stopStarClicking()
                  );

                  stop.setOnClickListener(v -> shutdown());'''

              assert marker in floating
              floating = floating.replace(
                  marker,
                  replacement,
                  1
              )

              marker = (
                  "    private void setSize(String size) {"
              )

              methods = '''    private void setStarSpeed(
                  String speed
              ) {
                  prefs.edit()
                      .putString(
                          "star_click_speed",
                          speed
                      )
                      .apply();

                  updateCaptureStatus();
              }

              private void startStarClicking() {
                  boolean ready =
                      prefs.getBoolean(
                          "star_accessibility_ready",
                          false
                      );

                  if (!ready) {
                      android.widget.Toast.makeText(
                          this,
                          "请先在系统无障碍设置中开启暗号AI V2",
                          android.widget.Toast.LENGTH_LONG
                      ).show();
                      return;
                  }

                  prefs.edit()
                      .putLong("star_click_count", 0)
                      .putBoolean(
                          "star_click_enabled",
                          true
                      )
                      .apply();

                  updateCaptureStatus();
              }

              private void stopStarClicking() {
                  prefs.edit()
                      .putBoolean(
                          "star_click_enabled",
                          false
                      )
                      .apply();

                  updateCaptureStatus();
              }

              '''

              assert marker in floating
              floating = floating.replace(
                  marker,
                  methods + marker,
                  1
              )

              marker = '''              boolean moving =
                      prefs.getBoolean(
                          "capture_moving",
                          false
                      );'''

              replacement = '''              boolean moving =
                      prefs.getBoolean(
                          "capture_moving",
                          false
                      );

                  boolean starClicking =
                      prefs.getBoolean(
                          "star_click_enabled",
                          false
                      );

                  boolean starReady =
                      prefs.getBoolean(
                          "star_accessibility_ready",
                          false
                      );

                  long starCount =
                      prefs.getLong(
                          "star_click_count",
                          0
                      );

                  String starSpeed =
                      prefs.getString(
                          "star_click_speed",
                          "slow"
                      );

                  String starSpeedName =
                      "fast".equals(starSpeed)
                          ? "快"
                          : "medium".equals(starSpeed)
                              ? "中"
                              : "慢";'''

              assert marker in floating
              floating = floating.replace(
                  marker,
                  replacement,
                  1
              )

              marker = '''                      + "\\n自动操作：关闭"
                  );'''

              replacement = '''                      + "\\n自动操作："
                      + (
                          starClicking
                              ? "祭坛连点运行中"
                              : "关闭"
                      )
                      + "\\n无障碍："
                      + (
                          starReady
                              ? "已连接"
                              : "未连接"
                      )
                      + "\\n祭坛速度："
                      + starSpeedName
                      + "\\n本次点击："
                      + starCount
                  );'''

              assert marker in floating
              floating = floating.replace(
                  marker,
                  replacement,
                  1
              )

              marker = '''    private void shutdown() {
                  statusHandler.removeCallbacks(statusUpdater);'''

              replacement = '''    private void shutdown() {
                  statusHandler.removeCallbacks(statusUpdater);

                  prefs.edit()
                      .putBoolean(
                          "star_click_enabled",
                          false
                      )
                      .apply();'''

              assert marker in floating
              floating = floating.replace(
                  marker,
                  replacement,
                  1
              )

          floating_path.write_text(
              floating,
              encoding="utf-8"
          )

          gradle_path = Path("app/build.gradle")
          gradle = gradle_path.read_text(
              encoding="utf-8"
          )

          gradle = gradle.replace(
              "versionCode 4",
              "versionCode 5"
          )

          gradle = gradle.replace(
              'versionName "0.2.3"',
              'versionName "0.2.4"'
          )

          gradle_path.write_text(
              gradle,
              encoding="utf-8"
          )
          PY

      - name: Save V2.4 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git commit -m "Add V2.4 star altar accessibility clicker"
          git push
